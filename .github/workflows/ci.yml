name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 3.11 is the floor in pyproject.toml; 3.14 is what the tests are developed
    # against locally. A refactor that only works on one of them is a bug.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests tools

      - name: Test
        run: pytest
